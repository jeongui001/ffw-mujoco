[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ffw-control"
version = "0.1.0"
description = "MuJoCo FFW-SH5 dual-hand slider control project"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
ffw-control = "ffw_control.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ffw_control.ui" = ["fonts/*.ttf", "fonts/LICENSE.txt"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
